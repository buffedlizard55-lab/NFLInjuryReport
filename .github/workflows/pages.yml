name: Deploy site to GitHub Pages

# Publishes docs/ as the site root and copies data/latest + data/state alongside
# it, so the static page can read the committed JSON with a relative URL.
# There is no build step and no bundler: plain HTML/CSS/JS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          [ -d data/latest ] && cp -r data/latest _site/data/latest
          [ -d data/state ]  && cp -r data/state  _site/data/state
          # A missing snapshot must not 404 the whole page; the JS shows a
          # clear "no data yet" state instead of failing silently.
          mkdir -p _site/data/latest
          for f in report alerts flags social scorecard meta health; do
            [ -f "_site/data/latest/$f.json" ] || echo '{}' > "_site/data/latest/$f.json"
          done
          echo "Site contents:"; find _site -maxdepth 3 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
